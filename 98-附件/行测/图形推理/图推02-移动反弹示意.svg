  <g fill="none" stroke="#cbd5e1" stroke-width="3"><rect x="450" y="260" width="150" height="120"/><rect x="650" y="260" width="150" height="120"/><rect x="850" y="260" width="150" height="120"/><path d="M450 320h150 M650 320h150 M850 320h150"/></g>
