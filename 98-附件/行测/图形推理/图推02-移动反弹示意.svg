  <g fill="#334155" font-size="20" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle"><text x="145" y="211">第 1 图：①</text><text x="425" y="211">第 2 图：②</text><text x="705" y="211">第 3 图：②</text><text x="985" y="211">第 4 图：①</text></g>
