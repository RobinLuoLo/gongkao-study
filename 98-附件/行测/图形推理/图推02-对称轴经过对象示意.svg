<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-label="对称轴过点、过线、过面示意：分别观察轴经过的黑点、重合的线段及穿过的封闭区域">
  <rect width="1200" height="370" rx="18" fill="#f8fafc"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <text x="200" y="50" font-size="29" fill="#0f172a">过点</text>
    <text x="600" y="50" font-size="29" fill="#0f172a">过线</text>
    <text x="1000" y="50" font-size="29" fill="#0f172a">过面</text>
    <text x="200" y="332" font-size="20" fill="#475569">数轴经过的标记点</text>
    <text x="600" y="332" font-size="20" fill="#475569">轴与原线段重合</text>
    <text x="1000" y="332" font-size="20" fill="#475569">数轴穿过的封闭区域</text>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="6">
    <path d="M200 80 L320 190 L200 300 L80 190 Z"/>
    <rect x="495" y="90" width="210" height="200"/>
    <rect x="895" y="75" width="210" height="230"/>
    <ellipse cx="1000" cy="115" rx="55" ry="27"/>
    <ellipse cx="1000" cy="190" rx="55" ry="27"/>
    <ellipse cx="1000" cy="265" rx="55" ry="27"/>
  </g>
  <g fill="none" stroke="#e11d48" stroke-width="5" stroke-dasharray="11 8">
    <path d="M200 72v235 M600 72v235 M1000 65v250"/>
  </g>
  <circle cx="200" cy="190" r="13" fill="#0f172a"/>
  <line x1="600" y1="115" x2="600" y2="265" stroke="#0f172a" stroke-width="9"/>
</svg>
